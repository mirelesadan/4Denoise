[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourdenoise-main"
version = "1.0.0"
description = "4Denoise classroom demo utilities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "scikit-image>=0.22,<1",
  "PyWavelets>=1.5,<2",
  "scikit-learn>=1.4,<2",
  "h5py>=3.10,<4",
  "tqdm>=4.66,<5",
  "opencv-python-headless>=4.10,<5",
  "numba>=0.61,<1",
  "tensorly>=0.9,<1",
  "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
rosetta = ["rosettasciio>=0.14,<0.15", "dask[array]>=2024.12,<2027"]
simulation = [
  "abtem>=1,<2",
  "ase>=3.23",
  "scikit-optimize>=0.10,<1",
]
notebook = [
  "jupyterlab>=4.2,<5",
  "notebook>=7.3,<8",
  "ipykernel>=6.29,<7",
  "py4DSTEM==0.14.18",
  "ncempy>=1.11",
  "emdfile>=0.0.16",
  "matplotlib-scalebar>=0.9",
  "xgboost",
]
bm = ["bm3d", "bm4d"]
interactive = ["ipympl>=0.9,<1"]
docs = [
  "sphinx>=7.2,<9",
  "myst-parser>=4,<5",
  "myst-nb>=1.4,<2",
  "furo>=2024.8.6,<2026",
]
docs-test = [
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "ipykernel>=6.29,<8",
]

[tool.setuptools]
py-modules = [
  "fourdenoise",
  "fourdenoise_geometry",
  "fourdenoise_metadata",
  "fourdenoise_rq",
  "fourdenoise_reductions",
  "fourdenoise_resampling",
  "fourdenoise_strain",
  "fourdenoise_streaming",
  "fourdenoise_traversals",
  "fourdenoise_plotting",
  "fourdenoise_io",
  "fourdenoise_sources",
  "fourdenoise_peaks",
  "fourdenoise_detectors",
  "fourdenoise_rosetta",
  "abTEM_helpers",
  "rippleModel",
  "kin_diff_sim"
]
